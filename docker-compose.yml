services:
  db:
    image: postgres:16-alpine
    container_name: flyaway-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flyaway}
      POSTGRES_USER: ${DB_USER:-flyaway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flyaway}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - flyaway-db-data:/var/lib/postgresql/data

volumes:
  flyaway-db-data:
