spring.application.name=flyaway

# --- Base de datos (PostgreSQL via Docker) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flyaway}
spring.datasource.username=${DB_USER:flyaway}
spring.datasource.password=${DB_PASSWORD:flyaway}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# jwt.secret debe ser una clave Base64 de al menos 256 bits para HS256.
jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWZseS1hd2F5LXRyYXZlbC1qd3Qtc2VjcmV0LWtleS0yNTZiaXRz}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8080}
